# Render.com — payments API (no gcloud required)
# 1. Push repo to GitHub
# 2. https://dashboard.render.com → New → Blueprint → connect repo
# 3. Set RAZORPAY_KEY_SECRET in Render dashboard (sync: false)
# 4. Copy service URL into assets/razorpay-config.js → apiUrl

services:
  - type: web
    name: workpilot-payments
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: CORS_ORIGINS
        value: https://workpilottools.biz,https://www.workpilottools.biz,https://englishlearner.store,https://logictrade.site
      - key: RAZORPAY_KEY_ID
        value: rzp_live_T28wwjAyHRA0jd
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RAZORPAY_MERCHANT_NAME
        value: WorkPilot Tools
      - key: RAZORPAY_MERCHANT_DESC
        value: MarketMind Labs
