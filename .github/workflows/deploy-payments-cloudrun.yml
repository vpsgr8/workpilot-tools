# Deploy payment API to Google Cloud Run (optional — needs GCP secrets in GitHub)
# Settings → Secrets: GCP_PROJECT_ID, GCP_SA_KEY, RAZORPAY_KEY_SECRET
name: Deploy Payments API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-payments-cloudrun.yml"

jobs:
  deploy:
    if: ${{ secrets.GCP_PROJECT_ID != '' && secrets.GCP_SA_KEY != '' && secrets.RAZORPAY_KEY_SECRET != '' && secrets.JWT_SECRET != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy workpilot-payments \
            --source ./server \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region asia-south1 \
            --allow-unauthenticated \
            --set-env-vars "RAZORPAY_KEY_ID=rzp_live_T28wwjAyHRA0jd,RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }},JWT_SECRET=${{ secrets.JWT_SECRET }},CORS_ORIGINS=https://workpilottools.biz,https://www.workpilottools.biz,https://englishlearner.store,https://logictrade.site,RAZORPAY_MERCHANT_NAME=WorkPilot Tools,RAZORPAY_MERCHANT_DESC=MarketMind Labs"

      - name: Print service URL
        run: |
          gcloud run services describe workpilot-payments \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region asia-south1 \
            --format 'value(status.url)'
